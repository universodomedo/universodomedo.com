schema_version: 1
name: "inputs-e-telas-criacao-udm"
description: "Use quando a tarefa envolver renderizar inputs/campos em telas de criação, edição ou configuração no frontend do Universo do Medo — formulário, ConteudoForm, InputComRotulo, AlternaOpcao (boolean), SelecionadorOpcoes (dropdown/MultiSelect), InputNumerico, InputData, ou substituir input/checkbox/select cru pelos componentes padronizados."
selection:
    requirement: "required"
    rules:
        - id: "componentes-de-input-por-nome"
          match:
              identifier:
                  - "InputComRotulo"
                  - "AlternaOpcao"
                  - "SelecionadorOpcoes"
                  - "InputNumerico"
                  - "InputData"
        - id: "arquivos-de-input-e-formulario"
          match:
              path_glob:
                  - "**/Elementos/Inputs/**"
                  - "**/SPA__*Nova*.tsx"
                  - "**/SPA__*Novo*.tsx"
                  - "**/SPA__*Criar*.tsx"
                  - "**/SPA__*Cadastr*.tsx"
                  - "**/SPA__*Edicao*.tsx"
                  - "**/SPA__*Config*.tsx"
                  - "**/*criar*/componentes.tsx"
                  - "**/*cadastr*/componentes.tsx"
                  - "**/*edicao*/componentes.tsx"
        - id: "termos-de-input-e-formulario"
          match:
              terms_any:
                  - "input"
                  - "inputs"
                  - "formulario"
                  - "formularios"
                  - "checkbox"
                  - "checkboxes"
                  - "toggle"
                  - "dropdown"
                  - "dropdowns"
                  - "multiselect"
                  - "renderizar input"
                  - "renderizar inputs"
                  - "campo de formulario"
                  - "campos do formulario"
                  - "campos de formulario"
                  - "tela de criacao"
                  - "tela de edicao"
                  - "tela de configuracao"
                  - "telas de criacao"
                  - "pagina de criacao"
                  - "pagina de edicao"
                  - "input com rotulo"
                  - "alterna opcao"
                  - "selecionador de opcoes"
